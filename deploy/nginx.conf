# Static mockup of Modulus (delivery 0). Security headers on every answer; nothing is fetched from elsewhere.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-cache" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri /index.html; }
}
