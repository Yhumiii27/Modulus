     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro
     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel
     accent held (L 0.660, so the documented ratios survive) and chroma
     in the product blurple's own range (its token sits at C 0.118; the
     accent takes 0.125, from the old steel's 0.030):
     the accent now reads as an accent rather than another neutral. */
  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same
     hue, same L 0.734, chroma at the same 2:3 proportion it held */
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f3f5fe;
  --color-neutral-200: #e4e7f5;
  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-100: #f5f4ff;
  --color-accent-200: #e7e5fe;
  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --color-accent-2-100: #f5f4ff;
  --color-accent-2-200: #e7e5fe;
  --color-accent-2-300: #d2cefd;
  --color-accent-2-400: #b5afe8;
  --color-accent-2-500: #9690c9;
  --color-accent-2-600: #7972a9;
  --color-accent-2-700: #5c5783;
  --color-accent-2-800: #423e5d;
  --color-accent-2-900: #2b293a;

  /* Deck section-divider ground — review round 3: saturation as presence.
     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own
     family; C 0.094 — written when the accent held C 0.030, before the
     round-7 blurple raised it past the ground's) with a lighter bloom and
     a ghost tint of the same hue, while the slide grounds stay
     desaturated. Deck-scale fills only — not interface colors. */
  --color-section: #262a60;
  --color-section-glow: #353b80;
  --color-section-ghost: #4c5397;

  --font-heading: "Inter", system-ui, sans-serif;
  --font-heading-weight: 500;
  --font-body: "Inter", system-ui, sans-serif;

  --space-1: 2.8px;
  --space-2: 5.6px;
  --space-3: 8.4px;
  --space-4: 11.2px;
  --space-6: 16.8px;
  --space-8: 22.4px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 0 0 1px #3f424d;
  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.lighten{mix-blend-mode:lighten;background-color:transparent}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
/* Rules fade to transparent at both ends instead of stopping cleanly — a
   Nocturne signature. The ramp is 48px an end (one deck baseline unit),
   painted from the same divider token. Freestanding rules fade; box
   outlines, in-control separators, and short accent marks stay solid. */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid transparent;
}
/* Row rules as row-level strips so the end-fade spans the row, not each cell. */
.table thead tr {
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr {
  background: linear-gradient(to right,
    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr:hover {
  /* the hover tint layers over the row rule, which keeps painting */
  background:
    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),
                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,
    linear-gradient(to right,
      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }


/* ══════════════════════════════════════════════════════════════════════════
   Thème clair (Norma 1.0, propriétaire 24 novembre 2026) — <html data-theme="light">.
   Les rampes tonales sont inversées (100 ↔ 900…) : un composant qui prend un
   « fond teinté » dans les pas sombres (700–900) et son texte dans les pas clairs
   (100–300) reste juste dans les deux thèmes, sans rien changer à son CSS. Seuls
   le fond, la surface, le texte, l'accent (plus sombre, pour le contraste sur
   blanc), les séparateurs et les ombres sont redéfinis. Le thème sombre reste
   celui par défaut.
   ══════════════════════════════════════════════════════════════════════ */
:root { color-scheme: dark; }
:root[data-theme="light"] {
  color-scheme: light;
  --color-bg: #f4f5f9;
  --color-surface: #ffffff;
  --color-text: #1c1e29;
  --color-accent: #5f51b8;
  --color-accent-2: #6d67a8;
  --color-divider: color-mix(in srgb, #1c1e29 14%, transparent);

  --color-neutral-100: #1f2128;
  --color-neutral-200: #33363f;
  --color-neutral-300: #4a4d5a;
  --color-neutral-400: #5f6272;
  --color-neutral-500: #7c8093;
  --color-neutral-600: #a2a6b8;
  --color-neutral-700: #c9ccdb;
  --color-neutral-800: #e2e4ee;
  --color-neutral-900: #eef0f6;

  --color-accent-100: #251f4a;
  --color-accent-200: #362e6b;
  --color-accent-300: #4a3f92;
  --color-accent-400: #5f51b8;
  --color-accent-500: #7b6fd0;
  --color-accent-600: #a49ae6;
  --color-accent-700: #cbc5f6;
  --color-accent-800: #e3e0fb;
  --color-accent-900: #f1effd;

  --color-accent-2-100: #26233f;
  --color-accent-2-200: #37335a;
  --color-accent-2-300: #4b467b;
  --color-accent-2-400: #615b9c;
  --color-accent-2-500: #7d78b6;
  --color-accent-2-600: #a5a1d2;
  --color-accent-2-700: #cbc8e9;
  --color-accent-2-800: #e3e1f4;
  --color-accent-2-900: #f1f0fa;

  --color-section: #e3e5fb;
  --color-section-glow: #cfd3f6;
  --color-section-ghost: #b4baee;

  --shadow-sm: 0 0 0 1px #e2e4ee;
  --shadow-md: 0 0 0 1px #c9ccdb, 0 6px 18px rgba(28, 30, 41, 0.10);
  --shadow-lg: 0 0 0 1px #a2a6b8, 0 16px 40px rgba(28, 30, 41, 0.16);
}
:root[data-theme="light"] .lighten { mix-blend-mode: normal; }
/* Norma 1.0.2 : textes secondaires plus soutenus en clair (55 % et 50 % du texte ne donnaient que 3,7:1 sur blanc,
   sous le seuil AA de 4,5:1 ; 68 % donne au moins 5,2:1 — relevé par l'a11y de Codex). */
:root[data-theme="light"] figcaption,
:root[data-theme="light"] .text-muted,
:root[data-theme="light"] .card-meta { color: color-mix(in srgb, var(--color-text) 68%, transparent); }

/* Touch targets on tablets (R-146, decision X-4). Media query = TOUCH_MEDIA in src/components/app/shell/tablet.ts:
   the tablet layout (≤ 1024 px) and any coarse pointer (an iPad in landscape is wider than 1024 px).
   Every Nocturne button, input, select and segmented option is at least 40 px high (and an icon button 40 px wide).
   The screens' compact variants (row actions, 24–32 px icon buttons, 26–34 px inline inputs) set their height in their
   own CSS modules with stronger selectors: `!important` is what keeps the 40 px minimum above all of them, on touch
   only. Text areas keep their own (larger) minimum. Desktop with a mouse is unchanged (the prototype's sizes). */
@media (max-width: 1024px), (pointer: coarse) {
  .btn,
  .seg-opt,
  .input:not(textarea) {
    min-height: 40px !important;
  }

  .btn {
    min-width: 40px !important;
  }

  .btn-icon {
    width: 40px;
    height: 40px;
  }

  /* Clickable table rows (ClickableRow) and the rows' inline actions. */
  .table tbody td {
    height: 40px;
  }
}

/* Modulus — maquette. Layout repris du shell d'Arche / Keystone (sidebar, page header, drawer, toast), charte Nocturne (Norma). */
html, body { overflow-x: hidden; }
body { min-height: 100vh; }
.ico { display: inline-block; flex: none; vertical-align: -0.15em; fill: currentColor; }
button { font: inherit; }

/* Bandeau de maquette */
.mock-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 16px; font-size: 12.5px; font-weight: 500;
  background: var(--color-accent-900); color: var(--color-accent-200);
  border-bottom: 1px solid var(--color-accent-800);
}
.mock-banner .ico { color: var(--color-accent); }
.mock-banner { flex-wrap: nowrap; align-items: flex-start; }
.mock-banner .ico { margin-top: 2px; }

/* Shell */
.root {
  display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 34px);
  background: radial-gradient(1200px 600px at 70% -10%, var(--color-accent-900), transparent 60%), var(--color-bg);
}
.main { display: flex; flex-direction: column; gap: 18px; padding: 20px 28px 48px; min-width: 0; }
.topbar { display: none; }

/* Sidebar */
.aside {
  display: flex; flex-direction: column; gap: 14px; padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow: auto;
  border-right: 1px solid var(--color-neutral-900); background: color-mix(in srgb, var(--color-bg) 70%, transparent);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo {
  width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--color-accent); display: grid; place-items: center;
  color: var(--color-accent); box-shadow: 0 0 14px color-mix(in srgb, var(--color-accent) 40%, transparent);
}
.wordmark { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.brand-sub { font-size: 10.5px; color: var(--color-neutral-500); margin-left: auto; }
.nsearch { position: relative; }
.nsearch .ico { position: absolute; left: 9px; top: 9px; color: var(--color-neutral-500); pointer-events: none; }
.nsearch .input { padding-left: 28px; padding-right: 38px; min-height: 32px; font-size: 12.5px; }
.kbd { position: absolute; right: 8px; top: 8px; font-size: 10px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--color-neutral-800); color: var(--color-neutral-500); pointer-events: none; }
.navlist { display: flex; flex-direction: column; gap: 2px; }
.entry {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 0; border-radius: var(--radius-md);
  font-size: 13px; text-align: left; cursor: pointer; background: transparent; color: var(--color-neutral-300); text-decoration: none;
}
.entry:hover { background: var(--color-neutral-900); color: var(--color-neutral-300); }
.entry.on, .entry.on:hover { background: var(--color-accent-900); color: var(--color-accent-300); }
.entry .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nbadge { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--color-accent-800); color: var(--color-accent-100); flex: none; }
.sechead { display: flex; align-items: center; gap: 8px; padding: 8px 8px 4px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); }
.sechead .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--color-neutral-800), transparent); }
.viewas { margin-top: auto; position: relative; }
.viewas-head { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); padding: 0 8px 6px; }
.trigger { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); text-align: left; cursor: pointer; }
.trigger:hover { background: var(--color-neutral-900); }
.avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--color-accent-800); color: var(--color-accent-200); display: grid; place-items: center; font-size: 11px; }
.who { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.who b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 11px; color: var(--color-neutral-400); }
.trigger .caret { margin-left: auto; color: var(--color-neutral-500); }
.pmenu { position: absolute; z-index: 40; bottom: calc(100% + 6px); left: 0; right: 0; display: flex; flex-direction: column; padding: 6px; border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-md); }
.pmenu[hidden] { display: none; }
.persona { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 0; border-radius: 6px; color: var(--color-text); font-size: 12.5px; text-align: left; cursor: pointer; background: transparent; }
.persona:hover { background: var(--color-neutral-900); }
.persona.on { background: var(--color-accent-900); }
.persona .avatar { width: 24px; height: 24px; font-size: 10px; background: var(--color-neutral-800); color: var(--color-neutral-200); }

/* ── Configurateur ─────────────────────────────────────── */
function cfgEval() {
  const m = M(S.cfg.machine);
  const avail = OPTIONS.filter((o) => o.on.includes(m.code));
  const sel = new Set([...S.cfg.sel].filter((c) => avail.some((o) => o.code === c)));
  const state = {};
  // obligatoire si
  if (m.cap >= 40 && avail.some((o) => o.code === 'OPT-SEC-01')) { sel.add('OPT-SEC-01'); state['OPT-SEC-01'] = { locked: true, why: 'Obligatoire : capacité nominale ≥ 40 t/h (règle « obligatoire si »)' }; }
  // impose
  for (const r of RULES.filter((r) => r.kind === 'impose')) if (sel.has(r.a) && avail.some((o) => o.code === r.b)) { sel.add(r.b); state[r.b] = { locked: true, why: `Imposée par ${r.a} ${O(r.a).label} (règle « impose »)` }; }
  // exclut
  for (const r of RULES.filter((r) => r.kind === 'exclut')) {
    if (sel.has(r.a)) state[r.b] = { dis: true, why: `Exclue par ${r.a} ${O(r.a).label} (règle « exclut »)` };
    if (sel.has(r.b)) state[r.a] = { dis: true, why: `Exclue par ${r.b} ${O(r.b).label} (règle « exclut »)` };
  }
  // une parmi
  for (const r of RULES.filter((r) => r.kind === 'une parmi')) {
    if (sel.has(r.a) && avail.some((o) => o.code === r.b)) state[r.b] = { why: `Groupe « Protocole automate » : la choisir remplace ${r.a}` };
    if (sel.has(r.b) && avail.some((o) => o.code === r.a)) state[r.a] = { why: `Groupe « Protocole automate » : la choisir remplace ${r.b}` };
  }
  S.cfg.sel = sel;
  const chosen = avail.filter((o) => sel.has(o.code));
  const sale = m.sale + chosen.reduce((s, o) => s + o.sale, 0);
  const budget = m.budget + chosen.reduce((s, o) => s + o.budget, 0);
  const weeks = m.lead + chosen.reduce((s, o) => Math.max(s, o.weeks), 0);
  return { m, avail, sel, state, chosen, sale, budget, weeks };
}

function closePanel() { const ov = document.getElementById('overlay'); if (ov) ov.innerHTML = ''; }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<div class="card toast" role="status">${I('info', 16)}<span>${msg}</span><button class="btn btn-ghost" data-toast-close aria-label="Fermer">${I('x', 14)}</button></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.innerHTML = ''), 4200);
}

/* ════════════════════ Routeur ════════════════════ */
function route() {
  const h = (location.hash || '#/').slice(1);
  const p = h.split('/').filter(Boolean);
  if (!p.length) return vHome();
  if (p[0] === 'catalogue') return p[1] ? vMachine(p[1]) : vCatalogue();
  if (p[0] === 'configurateur') return vConfigurateur();
  if (p[0] === 'affaires') return p[1] ? vDeal(p[1]) : vAffaires();
  if (p[0] === 'cotations') return p[1] ? vCotation(p[1]) : vCotations();
  if (p[0] === 'ventes') return p[1] ? vVente(p[1]) : vVentes();
  if (p[0] === 'savoir-faire') return vSavoirFaire();
  if (p[0] === 'admin') return p[1] === 'seuils' ? vAdminS() : vAdminQ();
  return vNotFound();
}

function render(keepScroll) {
  const v = route();
  document.body.dataset.cost = cost() ? '1' : '0';
  const aside = document.getElementById('aside');
  const q = document.getElementById('nav-q');
  const hadFocus = q && document.activeElement === q;
  aside.innerHTML = renderSidebar(v.nav);
  if (hadFocus) { const nq = document.getElementById('nav-q'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); }
  document.getElementById('content').innerHTML = header(v.head) + v.body;
  document.title = `${v.head.title.replace(/<[^>]+>/g, '')} · Modulus (maquette)`;
  if (!keepScroll) window.scrollTo(0, 0);
}

/* ════════════════════ Événements ════════════════════ */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-close],[data-toast-close],[data-panel],[data-toast],[data-tab],[data-seg],[data-role],[data-theme-set],[data-lang],[data-cfg],[data-cfg-reset],[data-cell],[data-fam],[data-amenu],#ptrigger,#psubmit,#navbtn,.scrim-nav,tr[data-href]');
  const pm = document.getElementById('pmenu');
  if (pm && !e.target.closest('.viewas')) pm.hidden = true;
  document.querySelectorAll('.amenu').forEach((m) => { if (!e.target.closest('[data-amenu]')) m.hidden = true; });
  if (!t) return;
  if (t.matches('tr[data-href]')) { if (!e.target.closest('a,button,input')) location.hash = t.dataset.href; return; }
  if (t.hasAttribute('data-close')) { e.preventDefault(); closePanel(); return; }
  if (t.hasAttribute('data-toast-close')) { document.getElementById('toast').innerHTML = ''; return; }
  if (t.id === 'navbtn') { document.body.classList.add('nav-open'); return; }
  if (t.classList.contains('scrim-nav')) { document.body.classList.remove('nav-open'); return; }
  if (t.hasAttribute('data-amenu')) { const m = t.nextElementSibling; m.hidden = !m.hidden; return; }
  if (t.id === 'ptrigger') { const m = document.getElementById('pmenu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); return; }
  if (t.id === 'psubmit') {
    e.preventDefault();
    if (t.hasAttribute('data-validate')) {
      const missing = [...document.querySelectorAll('#pform .field')].filter((f) => f.querySelector('.req')).filter((f) => { const i = f.querySelector('input,select,textarea'); return i && (!i.value.trim() || i.value === '—'); });
      document.querySelectorAll('#pform .field').forEach((f) => f.classList.remove('err'));
      if (missing.length) {
        missing.forEach((f) => f.classList.add('err'));
        document.getElementById('qerr').innerHTML = `<div class="errbox"><b>Demande incomplète : ${missing.length} réponses obligatoires manquantes</b><ul>${missing.slice(0, 8).map((f) => `<li>${f.querySelector('label').textContent.replace('*', '')}</li>`).join('')}${missing.length > 8 ? `<li>… et ${missing.length - 8} autres</li>` : ''}</ul></div>`;
        missing[0].querySelector('input,select,textarea').focus();
        return;
      }
    }
    closePanel(); toast('Maquette : rien n’est enregistré. ' + (document.getElementById('pt')?.textContent || '')); return;
  }
  if (t.hasAttribute('data-panel')) { e.preventDefault(); const id = t.dataset.panel; if (PANELS[id]) openPanel(PANELS[id]()); return; }
  if (t.hasAttribute('data-cell')) { const [m, i] = t.dataset.cell.split('|'); openPanel(cellPanel(m, +i)); return; }
  if (t.hasAttribute('data-toast')) { e.preventDefault(); toast(t.dataset.toast); if (t.type === 'checkbox') e.preventDefault(); return; }
  if (t.hasAttribute('data-tab')) { const [k, v] = t.dataset.tab.split(/:(?=[^:]*$)/); S.tabs[k] = v; render(true); return; }
  if (t.hasAttribute('data-seg')) {
    const [k, v] = t.dataset.seg.split(':');
    if (k === 'cat') S.catFilter = v; else if (k === 'deal') S.dealFilter = v; else if (k === 'q') S.qFilter = v; else if (k === 'k') S.kfilter = v;
    else { t.parentElement.querySelectorAll('.opt').forEach((o) => o.classList.toggle('on', o === t)); return; }
    render(true); return;
  }
  if (t.hasAttribute('data-role')) { S.role = t.dataset.role; document.body.classList.remove('nav-open'); render(true); toast(`Vous voyez Modulus en tant que ${ROLES[S.role].name} (${ROLES[S.role].label}) · coûts ${cost() ? 'visibles' : 'masqués'}.`); return; }
  if (t.hasAttribute('data-theme-set')) { S.theme = t.dataset.themeSet; document.documentElement.dataset.theme = S.theme; try { localStorage.setItem('modulus-maquette-theme', S.theme); } catch (_) {} render(true); return; }
  if (t.hasAttribute('data-lang')) { if (t.dataset.lang === 'en') toast('Maquette en français seulement.'); return; }
  if (t.hasAttribute('data-cfg')) { S.cfg.machine = t.dataset.cfg; location.hash = '#/configurateur'; return; }
  if (t.hasAttribute('data-cfg-reset')) { S.cfg = { machine: 'EMP-200', qty: 1, sel: new Set() }; render(true); return; }
  if (t.hasAttribute('data-fam')) { S.qFamily = t.dataset.fam; render(true); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-opt]')) {
    const code = t.dataset.opt;
    if (t.checked) {
      S.cfg.sel.add(code);
      for (const r of RULES.filter((r) => r.kind === 'une parmi')) { if (code === r.a) S.cfg.sel.delete(r.b); if (code === r.b) S.cfg.sel.delete(r.a); }
    } else S.cfg.sel.delete(code);
    render(true);
  } else if (t.id === 'cfg-m') { S.cfg.machine = t.value; render(true); }
  else if (t.id === 'cfg-q') { S.cfg.qty = Math.max(1, Math.min(20, +t.value || 1)); render(true); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'nav-q') render(true); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePanel(); document.body.classList.remove('nav-open'); const pm = document.getElementById('pmenu'); if (pm) pm.hidden = true; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.body.classList.add('nav-open'); document.getElementById('nav-q').focus(); }
  if (e.key === 'Enter' && e.target.id === 'nav-q') { const a = document.querySelector('.navlist a'); if (a) { location.hash = a.getAttribute('href'); e.target.value = ''; } }
});
window.addEventListener('hashchange', () => { closePanel(); document.body.classList.remove('nav-open'); const q = document.getElementById('nav-q'); if (q) q.value = ''; render(); });
try { const th = localStorage.getItem('modulus-maquette-theme'); if (th === 'light' || th === 'dark') S.theme = th; } catch (_) {}
document.documentElement.dataset.theme = S.theme;
render();

</script>
</body>
</html>
